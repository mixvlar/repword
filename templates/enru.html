<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>EN → RU</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="card" data-mode="enru">

    <div id="start-screen">
        <h2>Английский → Русский</h2>
        <button class="btn btn-blue" onclick="start()">Начать</button>
    </div>

    <div id="q-counter" class="text-sm text-gray-500 mb-4 hidden">0 / 0</div>

    <div id="quiz" class="hidden">
        <h3 id="q-question"></h3>
        <p id="q-transcription" class="text-gray-400 italic"></p>
        <div id="q-extra-info" class="text-sm text-gray-500 mb-2"></div>

        <button class="btn btn-outline mb-4" onclick="sayCurrent()">🔊</button>

        <input id="q-input" autocomplete="off" spellcheck="false" placeholder="Введите перевод...">
        <div id="q-feedback"></div>
        <div id="q-actions"></div>
    </div>

    <div id="results" class="hidden">
        <h3>Результаты сессии</h3>
        <table>
            <thead>
                <tr>
                    <th>Слово</th>
                    <th>Перевод</th>
                    <th>Уровень</th>
                    <th>Попытки</th>
                </tr>
            </thead>
            <tbody id="res-body"></tbody>
        </table>
        <button class="btn btn-blue" onclick="location.href='/'">На главную</button>
    </div>

</div>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
